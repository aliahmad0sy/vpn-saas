name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vpn
          POSTGRES_PASSWORD: vpn_ci_password
          POSTGRES_DB: vpn_saas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vpn -d vpn_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vpn:vpn_ci_password@localhost:5432/vpn_saas?schema=public
      AUTH_SECRET: ci-dummy-secret-0000000000000000
      AUTH_TRUST_HOST: 'true'
      ENCRYPTION_KEY: ci-dummy-encryption-key-please-rotate
      CRON_SECRET: ci-dummy-cron-secret-please-rotate
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma db push (CI db)
        run: npx prisma db push --skip-generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Boot smoke test
        run: |
          npm start &
          APP_PID=$!
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/healthz >/dev/null; then
              echo "healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/healthz
          curl -fsS -o /dev/null -w "pricing=%{http_code}\n" http://localhost:3000/pricing
          curl -fsS -o /dev/null -w "login=%{http_code}\n"    http://localhost:3000/login
          kill $APP_PID

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: shieldvpn-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
