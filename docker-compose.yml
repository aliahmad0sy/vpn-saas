services:
  postgres:
    image: postgres:16-alpine
    container_name: vpn-saas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vpn
      POSTGRES_PASSWORD: vpn_dev_password
      POSTGRES_DB: vpn_saas
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vpn -d vpn_saas']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpn-saas-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vpn:vpn_dev_password@postgres:5432/vpn_saas?schema=public
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-please-change-in-prod-0000000000000000}
      AUTH_TRUST_HOST: 'true'
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dummy}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dummy}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_dummy}
    ports:
      - '3000:3000'

volumes:
  postgres_data:
