services:
  postgres:
    image: postgres:16-alpine
    container_name: vpn-saas-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: vpn
      POSTGRES_PASSWORD: vpn_dev_password
      POSTGRES_DB: vpn_saas
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vpn -d vpn_saas']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
